# Phase 1 slice: database only. app + worker services are added when those packages exist.
services:
  db:
    image: postgres:16
    environment: { POSTGRES_USER: shipdesk, POSTGRES_PASSWORD: shipdesk_demo_only, POSTGRES_DB: shipdesk }
    ports: ["5432:5432"]
    volumes: [dbdata:/var/lib/postgresql/data]
volumes: { dbdata: {} }
